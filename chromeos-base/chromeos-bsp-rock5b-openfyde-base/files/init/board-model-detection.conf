description     "Auto detect Rock 5B board model and set dtb file"
author          "glass@fydeos.io"

start on starting boot-services

task

oom score -100

script
  if [ ! -f /mnt/stateful_partition/fyde/.board_model_detected ]; then
    mkdir /mnt/stateful_partition/fyde || true # croslint: disable:
    touch /mnt/stateful_partition/fyde/.board_model_detected  # croslint: disable:
    /usr/sbin/board_model_detection.sh
  fi
end script
